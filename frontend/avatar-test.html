<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>avatar-test (tạm, sẽ xóa)</title>
<style>html,body,#root{margin:0;height:100%;background:#fff}</style></head><body><div id="root"></div><pre id="out" style="position:fixed;left:4px;top:4px;margin:0;font:11px monospace"></pre>
<script type="module">
// TRANG THỬ TẠM - xóa sau khi kiểm tra
import React from 'react';
import { createRoot } from 'react-dom/client';
import AvatarViewer from '/src/features/fitting/avatar/AvatarViewer.jsx';
const q = new URLSearchParams(location.search);
window.__thorsDbg = JSON.parse(q.get('dbg') || '{}');
const FAB = { 'ao-cuban-xanhnavy-male': 'LinenNavy', 'quan-jeans-xanh-male': 'Denim_Blue', 'giay-luoi-den-male': 'Leather_Black', 'ao-somi-xanhmint-male': 'ShirtMint',
  'ao-blouse-xanhmint-female': 'ShirtMint', 'chan-vay-denim-female': 'Denim_Indigo', 'giay-bup-be-hong-female': 'Satin_Pink' };
const SLOT = { 'quan-jeans-xanh-male': 'BOTTOM', 'chan-vay-denim-female': 'BOTTOM', 'giay-luoi-den-male': 'SHOES', 'giay-bup-be-hong-female': 'SHOES' };
const SZ = { S: { Size_up: 0, Size_down: 1 }, M: { Size_up: 0, Size_down: 0 }, L: { Size_up: 0.5, Size_down: 0 }, XL: { Size_up: 1, Size_down: 0 } };
const items = (q.get('items') || '').split(',').filter(Boolean);
const wear = items.map((f) => ({ slot: SLOT[f] || 'TOP', item: { id: f, url: '/__glbtest/' + f + '.glb', fabric: FAB[f] }, morphs: SZ[q.get('size') || 'M'] }));
createRoot(document.getElementById('root')).render(React.createElement('div', { style: { width: '100vw', height: '100vh' } },
  React.createElement(AvatarViewer, { profile: { gender: q.get('g') || 'MALE' }, wear, pose: q.get('pose') || null })));
setTimeout(() => { document.getElementById('out').textContent = 'DONE'; }, Number(q.get('wait') || 40) * 1000);
</script></body></html>
