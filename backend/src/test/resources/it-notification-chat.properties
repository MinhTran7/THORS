# Cấu hình chung cho com.thors.it.NotificationIntegrationTest / ChatIntegrationTest / ImageSearchIntegrationTest.
# H2 riêng (thors_it) với schema trùng tên database: các lớp *Schema / ChatRepository.ready() kiểm tra bảng bằng
# information_schema.tables WHERE table_schema = DATABASE(), nên bảng phải nằm trong schema "thors_it" như MySQL.
spring.datasource.url=jdbc:h2:mem:thors_it;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;LOCK_TIMEOUT=15000;INIT=CREATE SCHEMA IF NOT EXISTS thors_it\\;SET SCHEMA thors_it
spring.sql.init.schema-locations=classpath:test-schema.sql,classpath:it-notification-chat-schema.sql
# Không gọi dịch vụ ngoài thật (local.properties có thể có key thật)
thors.ai.gemini-api-key=
thors.ghn.token=
thors.ghn.shop-id=
thors.delivery.email-enabled=false
thors.payos.enabled=false
thors.facebook.enabled=false
thors.facebook.page-token=
thors.payos.client-id=
thors.payos.api-key=
thors.image-search.enabled=false
