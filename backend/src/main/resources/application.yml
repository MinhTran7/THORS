server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  config:
    import: "optional:file:./backend/local.properties,optional:file:./local.properties"
  application:
    name: thors-backend
  datasource:
    url: ${THORS_DB_URL:jdbc:mysql://thors-thors.g.aivencloud.com:10006/thors?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${THORS_DB_USER:avnadmin}
    password: ${THORS_DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    time-zone: UTC
thors:
  frontend-url: ${THORS_FRONTEND_URL:http://localhost:3000}
  auth:
    otp-secret: ${THORS_OTP_SECRET:}
    otp-seconds: 300
    resend-seconds: 60
    max-sends-per-hour: 10
  delivery:
    email-enabled: ${EMAIL_ENABLED:false}
    email-from: ${EMAIL_FROM:}
    sms-enabled: ${SMS_ENABLED:false}
    sms-account-sid: ${TWILIO_ACCOUNT_SID:}
    sms-auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_FROM:}
  shipping:
    # Vị trí cửa hàng: Bách Hóa Xanh, Đ. Liên Thôn, thôn Trung, xã Bình Minh, TP. Hà Nội
    # (Google Plus Code 7PH7WP2X+2WJ)
    store-lat: ${SHOP_LAT:20.900063}
    store-lng: ${SHOP_LNG:105.749828}
    self-radius-km: ${SELF_DELIVERY_RADIUS_KM:5}
    default-carrier: GHN
    goong-api-key: ${GOONG_API_KEY:}
  ghn:
    # Mặc định là môi trường thử nghiệm; chạy thật đổi GHN_BASE_URL sang
    # https://online-gateway.ghn.vn/shiip/public-api và dùng Token/ShopId của khachhang.ghn.vn
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    service-type-id: 2 # 2 = hàng nhẹ, 5 = hàng nặng
    required-note: CHOXEMHANGKHONGTHU # CHOTHUHANG / CHOXEMHANGKHONGTHU / KHONGCHOXEMHANG
    default-weight-g: ${GHN_DEFAULT_WEIGHT_G:500}
    default-length-cm: 20
    default-width-cm: 15
    default-height-cm: 10
    # Webhook: https://<backend>/api/ghn/webhook/<chuỗi này>; để trống = tắt webhook
    webhook-secret: ${GHN_WEBHOOK_SECRET:}
    # Hỏi GHN trạng thái các đơn đang giao định kỳ (dự phòng cho webhook, dùng được ở localhost)
    poll-enabled: ${GHN_POLL_ENABLED:true}
    # 30 giây/lần: hủy/giao bên GHN hiện trên THORS chậm nhất ~30 giây (mỗi lần tối đa 100 vận đơn)
    poll-interval-ms: ${GHN_POLL_INTERVAL_MS:30000}
  google:
    enabled: ${GOOGLE_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/login/oauth2/code/google}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:THORS Admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  facebook:
    enabled: ${FACEBOOK_ENABLED:false}
    client-id: ${FACEBOOK_CLIENT_ID:}
    client-secret: ${FACEBOOK_CLIENT_SECRET:}
    redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:3000/login/oauth2/code/facebook}
    api-version: ${FACEBOOK_API_VERSION:v23.0}
